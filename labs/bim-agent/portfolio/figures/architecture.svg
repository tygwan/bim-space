<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 790" font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- Figure A: BIM Agent layers. Sources: evidence/rea-structure.json (REA on our DLLs), notes/architecture.md 1, 5, 6. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
    <marker id="arrow-plugin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B61FF"/>
    </marker>
    <marker id="arrow-adapter" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E9F8E"/>
    </marker>
  </defs>
  <style>
    .t { fill: #1B2430; }
    .m { fill: #5B6675; }
    .h { font-size: 19px; font-weight: 700; }
    .meta { font-size: 13px; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12.5px; }
    .xs { font-size: 11.5px; }
    .big { font-size: 22px; font-weight: 800; }
  </style>

  <!-- Host -->
  <rect x="40" y="20" width="1080" height="70" rx="10" fill="#2B313A"/>
  <text x="64" y="52" class="h" fill="#FFFFFF">Autodesk Navisworks Manage 2025 · 2027</text>
  <text x="64" y="75" class="meta" fill="#C9D1DB">.NET API · TimeLiner API · COM 형상 · 선택과 뷰</text>

  <!-- Plugin -->
  <rect x="40" y="130" width="820" height="130" rx="10" fill="#F3F0FF" stroke="#7B61FF" stroke-width="1.5"/>
  <text x="60" y="160" class="h t">Plugin</text>
  <text x="128" y="160" class="meta m">BimAgent.Navisworks.dll</text>
  <text x="840" y="160" class="meta m" text-anchor="end">net48 · WPF · 타입 53 · IL 158 KB</text>
  <g class="s t">
    <rect x="60" y="178" width="186" height="62" rx="7" fill="#FFFFFF" stroke="#7B61FF"/>
    <text x="74" y="203" class="b">작업 창 4단계</text>
    <text x="74" y="224" class="xs m">분석 · 자격 · 설계 · 반영</text>
    <rect x="258" y="178" width="186" height="62" rx="7" fill="#FFFFFF" stroke="#7B61FF"/>
    <text x="272" y="203" class="b">검토 화면 9종</text>
    <text x="272" y="224" class="xs m">검토 · 규칙 설정 · 미리보기</text>
    <rect x="456" y="178" width="186" height="62" rx="7" fill="#FFFFFF" stroke="#7B61FF"/>
    <text x="470" y="203" class="b">확대 · 강조</text>
    <text x="470" y="224" class="xs m">3D 뷰에서 검토 대상 표시</text>
    <rect x="654" y="178" width="186" height="62" rx="7" fill="#FFFFFF" stroke="#7B61FF"/>
    <text x="668" y="203" class="b">일정 승인</text>
    <text x="668" y="224" class="xs m">승인된 일정만 반영</text>
  </g>

  <!-- Plugin -> Adapter, Plugin -> Core (bypass on the left) -->
  <line x1="300" y1="260" x2="300" y2="298" stroke="#5B6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="284" class="xs m">호출 21곳</text>
  <line x1="70" y1="260" x2="70" y2="448" stroke="#5B6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="440" class="xs m">Core 직접 사용</text>

  <!-- Adapter -->
  <rect x="110" y="300" width="750" height="110" rx="10" fill="#E8F7F4" stroke="#0E9F8E" stroke-width="1.5"/>
  <text x="130" y="330" class="h t">Adapter</text>
  <text x="212" y="330" class="meta m">BimAgent.NavisworksAdapter.dll</text>
  <text x="840" y="330" class="meta m" text-anchor="end">net48 · 타입 34 · IL 31 KB</text>
  <g>
    <rect x="130" y="344" width="230" height="50" rx="7" fill="#FFFFFF" stroke="#0E9F8E"/>
    <text x="144" y="366" class="b t">모델 읽기</text>
    <text x="144" y="384" class="xs m">객체 · 속성 · bbox · OBB</text>
    <rect x="370" y="344" width="230" height="50" rx="7" fill="#FFFFFF" stroke="#0E9F8E"/>
    <text x="384" y="366" class="b t">원본 기준 ID</text>
    <text x="384" y="384" class="xs m">원본 GUID(LcOaNodeGuid)</text>
    <rect x="610" y="344" width="230" height="50" rx="7" fill="#FFFFFF" stroke="#0E9F8E"/>
    <text x="624" y="366" class="b t">TimeLiner 반영</text>
    <text x="624" y="384" class="xs m">세트 · 작업, BimAgent/ 폴더만</text>
  </g>

  <line x1="300" y1="410" x2="300" y2="448" stroke="#5B6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="434" class="xs m">Core 데이터 형식으로 변환</text>

  <!-- Core -->
  <rect x="40" y="450" width="820" height="240" rx="10" fill="#EEF2FB" stroke="#1F3A93" stroke-width="1.5"/>
  <text x="60" y="480" class="h t">Core</text>
  <text x="118" y="480" class="meta m">BimAgent.Core.dll</text>
  <text x="840" y="480" class="meta m" text-anchor="end">netstandard2.0 · 타입 246 · IL 158 KB</text>
  <g>
    <rect x="56" y="496" width="466" height="70" rx="7" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="72" y="522" class="b t">Planning <tspan class="xs m" font-weight="400">64.1 KB</tspan></text>
    <text x="72" y="545" class="s m">연결 관계 · 일정 생성기 6종 · 순서 결정 기준 · CPM</text>
    <rect x="534" y="496" width="310" height="70" rx="7" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="550" y="522" class="b t">Diagnostics <tspan class="xs m" font-weight="400">44.2 KB</tspan></text>
    <text x="550" y="545" class="s m">모델 현황 · 속성 표준화 · 준비도 · 형상 인접</text>
  </g>
  <g class="xs">
    <rect x="56" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="66" y="599" class="b t" font-size="13px">Contracts</text><text x="66" y="618" class="m">형식 · 11.0</text>
    <rect x="169" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="179" y="599" class="b t" font-size="13px">Artifacts</text><text x="179" y="618" class="m">결과 파일 · 8.9</text>
    <rect x="282" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="292" y="599" class="b t" font-size="13px">Sampling</text><text x="292" y="618" class="m">정확도 표본 · 7.0</text>
    <rect x="395" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="405" y="599" class="b t" font-size="13px">Classification</text><text x="405" y="618" class="m">사전 · 6.8</text>
    <rect x="508" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="518" y="599" class="b t" font-size="13px">Rules</text><text x="518" y="618" class="m">JSON 규칙 · 6.1</text>
    <rect x="621" y="578" width="105" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="631" y="599" class="b t" font-size="13px">Geometry</text><text x="631" y="618" class="m">bbox · OBB · 5.1</text>
    <rect x="734" y="578" width="110" height="52" rx="6" fill="#FFFFFF" stroke="#1F3A93"/>
    <text x="744" y="599" class="b t" font-size="13px">Scheduling</text><text x="744" y="618" class="m">순서 기준 · 3.2</text>
  </g>
  <!-- IL share strip: widths proportional to IL bytes per namespace (788 px = 156.4 KB) -->
  <g>
    <rect x="56" y="644" width="323" height="16" fill="#1F3A93"/>
    <rect x="379" y="644" width="223" height="16" fill="#3D5BB8"/>
    <rect x="602" y="644" width="55" height="16" fill="#5C78C9"/>
    <rect x="657" y="644" width="45" height="16" fill="#7B93D6"/>
    <rect x="702" y="644" width="35" height="16" fill="#93A8DE"/>
    <rect x="737" y="644" width="34" height="16" fill="#A9BAE5"/>
    <rect x="771" y="644" width="31" height="16" fill="#BCCAEB"/>
    <rect x="802" y="644" width="26" height="16" fill="#CDD8F0"/>
    <rect x="828" y="644" width="16" height="16" fill="#DCE4F5"/>
  </g>
  <text x="56" y="679" class="xs m">띠: 영역별 코드 규모(IL, KB) 비율 · REA로 BIM Agent DLL을 분석한 결과</text>

  <!-- Host API calls (right column) -->
  <text x="975" y="122" class="b t">Navisworks API 호출</text>
  <path d="M860,195 H900 V92" fill="none" stroke="#7B61FF" stroke-width="2" marker-end="url(#arrow-plugin)"/>
  <path d="M860,357 H930 V92" fill="none" stroke="#0E9F8E" stroke-width="2" marker-end="url(#arrow-adapter)"/>
  <path d="M860,525 H950" fill="none" stroke="#1F3A93" stroke-width="2" stroke-dasharray="5 5"/>
  <g stroke="#1F3A93" stroke-width="2.2"><line x1="947" y1="518" x2="961" y2="532"/><line x1="961" y1="518" x2="947" y2="532"/></g>

  <text x="975" y="190" class="big" fill="#7B61FF">125곳</text>
  <text x="975" y="210" class="s m">확대 · 선택 · 임시 색상</text>
  <text x="975" y="228" class="s m">(화면 표시만)</text>

  <text x="975" y="352" class="big" fill="#0E9F8E">219곳</text>
  <text x="975" y="372" class="s m">모델 읽기 ·</text>
  <text x="975" y="390" class="s m">TimeLiner 반영</text>

  <text x="975" y="522" class="big" fill="#1F3A93">0곳</text>
  <text x="975" y="542" class="s m">Navisworks 참조 없음</text>
  <text x="975" y="560" class="s m">Navisworks 없이 시험</text>
  <text x="975" y="578" class="s m">286개 · 0.8초</text>

  <!-- Artifacts and host-free runner -->
  <line x1="245" y1="690" x2="245" y2="714" stroke="#5B6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="716" width="410" height="54" rx="8" fill="#FFFFFF" stroke="#B8C2CE"/>
  <text x="56" y="739" class="b t">artifacts/runs/&lt;runId&gt;/</text>
  <text x="56" y="759" class="s m">분석 결과 파일 22종(JSON) · 파일마다 버전 표기</text>
  <line x1="670" y1="716" x2="670" y2="692" stroke="#5B6675" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="480" y="716" width="380" height="54" rx="8" fill="#FFFFFF" stroke="#B8C2CE"/>
  <text x="496" y="739" class="b t">DiagnosticRunner <tspan class="xs m" font-weight="400">net8.0</tspan></text>
  <text x="496" y="759" class="s m">Navisworks 없이 2–9단계 재계산</text>
  <text x="975" y="739" class="b t">버전 호환</text>
  <text x="975" y="759" class="s m">경로만 바꿔 2027 실행</text>
</svg>
